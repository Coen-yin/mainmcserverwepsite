services:
  - type: web
    name: techy-mc
    env: node
    region: oregon
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      # Clerk authentication keys — get these from https://dashboard.clerk.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Set this to your Render app URL + /api/__clerk after first deploy
      # e.g. https://techy-mc.onrender.com/api/__clerk
      - key: VITE_CLERK_PROXY_URL
        sync: false
      # PostgreSQL database — add a Render PostgreSQL service and link it,
      # or paste your own DATABASE_URL here
      - key: DATABASE_URL
        fromDatabase:
          name: techy-mc-db
          property: connectionString

databases:
  - name: techy-mc-db
    databaseName: techymc
    plan: free
    region: oregon
