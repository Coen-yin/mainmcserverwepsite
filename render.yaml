services:
  - type: web
    name: techy-mc
    env: node
    region: oregon
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      # Clerk authentication — get keys from https://dashboard.clerk.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # After first deploy, set this to: https://YOUR-APP.onrender.com/api/__clerk
      - key: VITE_CLERK_PROXY_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: techy-mc-db
          property: connectionString

databases:
  - name: techy-mc-db
    databaseName: techymc
    plan: free
    region: oregon
